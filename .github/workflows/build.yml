name: Build Istiqamah APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --org com.example --project-name noor --platforms=android noor
          cd noor
          flutter pub add adhan geolocator shared_preferences
          cp ../main.dart lib/main.dart
          K=android/app/src/main/kotlin/com/example/noor
          mkdir -p $K
          cp ../MainActivity.kt ../BlockerService.kt ../BootReceiver.kt $K/
          python3 ../patch.py
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle*
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../istiqamah.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Istiqamah v${{ github.run_number }}
          files: istiqamah.apk
          fail_on_unmatched_files: trueDARR
